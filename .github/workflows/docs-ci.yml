name: Docs CI
on:
  pull_request:
  push:
    branches: [main]

env:
  # Pinned so CI is reproducible. An unpinned install can fail with ETARGET when a new
  # mint release is published before its @mintlify/cli dependency has propagated.
  MINT_VERSION: "4.2.1076"

jobs:
  validate:
    name: Validate docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Mintlify CLI
        run: |
          for attempt in 1 2 3; do
            npm install -g "mint@${MINT_VERSION}" && exit 0
            echo "npm install failed (attempt ${attempt}), retrying"; sleep 15
          done
          exit 1
      - name: Validate build
        run: mint validate
      - name: Check for broken links
        run: mint broken-links
      - name: Check generated redirects are up to date
        run: |
          python3 scripts/build-redirects.py
          git diff --exit-code docs.json landing/
